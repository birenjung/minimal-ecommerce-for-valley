name: saiwons-collection

services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-8001}:80'
            - '127.0.0.1:${VITE_PORT:-5174}:5173'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"
    mysql:
        image: 'mysql:8.4'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME:?Set DB_USERNAME in .env}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env}'
            MYSQL_TEST_DATABASE: 'saiwons_collection_test'
            MYSQL_TEST_USER: '${DB_TEST_USERNAME:?Set DB_TEST_USERNAME in .env}'
            MYSQL_TEST_PASSWORD: '${DB_TEST_PASSWORD:?Set DB_TEST_PASSWORD in .env}'
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './database/docker/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro'
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent >/dev/null 2>&1"]
            interval: 10s
            retries: 3
            timeout: 5s
        restart: "no"
    phpmyadmin:
        image: 'phpmyadmin:5.2.3-apache'
        ports:
            - '127.0.0.1:8081:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: '3306'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        restart: "no"
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
